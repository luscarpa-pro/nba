# Render Blueprint per NBA Studio (Tangible Lab).
# Creato per uso interno Tangible / Vittoria Assicurazioni.
#
# Deploy in 3 passi:
#   1. Push del repo su GitHub
#   2. Su Render: New + → Blueprint → punta a questo file
#   3. Imposta gli ENV (segreto + eventuale dominio)
services:
  - type: web
    name: nba-studio
    runtime: docker
    plan: starter            # $7/mese, 512MB, no sleep
    region: frankfurt        # Europa centrale (GDPR + bassa latency da IT)
    healthCheckPath: /lab/api/health
    autoDeploy: true
    envVars:
      # Segreto per firma cookie sessione. Generato automatico al primo deploy.
      - key: TANGIBLE_LAB_SECRET
        generateValue: true
      # I path mutevoli (DB, config, dataset) vivono su /data
      - key: TANGIBLE_LAB_DATA_DIR
        value: /data
      # Cookie secure (HTTPS-only). Disabilitare solo in dev.
      - key: TANGIBLE_LAB_SECURE_COOKIE
        value: "1"
    disk:
      name: lab-data
      mountPath: /data
      sizeGB: 1
