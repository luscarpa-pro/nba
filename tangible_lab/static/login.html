<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F1C3D" />
  <title>NBA Studio — Accedi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="/lab/studio.css" />
  <style>
    body.login{
      background:linear-gradient(180deg, #1F1C3D 0%, #15132C 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
    }
    .login-card{
      width:100%;max-width:380px;background:#fff;border-radius:14px;
      box-shadow:0 12px 40px rgba(0,0,0,.25);padding:28px 26px;
      display:flex;flex-direction:column;gap:14px
    }
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .login-brand .logo{height:36px;filter:brightness(0)}  /* SVG Vittoria è bianco di default → invertiamo per sfondo card */
    .login-brand .title{font-weight:800;font-size:16px;color:var(--primary);line-height:1.2}
    .login-brand .sub{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
    .login-card h1{font-size:18px;font-weight:700;color:var(--ink);margin:6px 0 0}
    .login-card .hint{font-size:12px;color:var(--muted);margin:0}
    .login-card label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .login-card input{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
    .login-card input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,28,61,.12)}
    .login-card .btn-login{
      background:linear-gradient(180deg, var(--primary) 0%, #15132C 100%);color:#fff;
      border:none;padding:11px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;gap:6px
    }
    .login-card .btn-login:hover{background:linear-gradient(180deg, #2a2752 0%, var(--primary) 100%)}
    .login-card .btn-login[disabled]{opacity:.5;cursor:not-allowed}
    .login-err{background:#FEE2E2;color:#991b1b;border:1px solid #FCA5A5;padding:8px 10px;border-radius:8px;font-size:12px;display:none}
    .login-err.show{display:block}
    .powered-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:#c7d2fe;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
    .powered-foot img{height:14px;filter:brightness(0) invert(1);opacity:.85}
  </style>
</head>
<body class="login">
  <div>
    <div class="login-card">
      <div class="login-brand">
        <img class="logo" src="/lab/assets/vittoria.svg" alt="Vittoria" />
        <div>
          <div class="title">NBA Studio</div>
          <div class="sub">Test &amp; Confronto Anagrafiche</div>
        </div>
      </div>
      <h1>Accedi</h1>
      <p class="hint">Inserisci le credenziali fornite dall'amministratore.</p>
      <div class="login-err" id="err"></div>
      <form id="login-form" autocomplete="on">
        <label>Username
          <input id="u" name="username" type="text" autocomplete="username" required autofocus />
        </label>
        <label style="margin-top:10px">Password
          <input id="p" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn-login" id="submit" style="margin-top:16px;width:100%">
          <span class="msi">login</span> Entra
        </button>
      </form>
    </div>
  </div>

  <script>
    const errBox = document.getElementById("err");
    const form = document.getElementById("login-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");
      const u = document.getElementById("u").value.trim();
      const p = document.getElementById("p").value;
      const btn = document.getElementById("submit");
      btn.disabled = true;
      try {
        const r = await fetch("/lab/api/login", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({username:u, password:p}),
          credentials:"include"
        });
        if (r.ok) {
          location.href = "/lab/";
          return;
        }
        const data = await r.json().catch(()=>({detail:"Errore"}));
        errBox.textContent = data.detail || "Credenziali non valide";
        errBox.classList.add("show");
      } catch (e) {
        errBox.textContent = "Errore di rete: " + e.message;
        errBox.classList.add("show");
      } finally {
        btn.disabled = false;
      }
    });

    // Se già loggato → home
    fetch("/lab/api/me", {credentials:"include"}).then(r => { if (r.ok) location.href = "/lab/"; });
  </script>
</body>
</html>
