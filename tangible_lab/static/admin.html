<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F1C3D" />
  <title>NBA Studio — Dati</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="/lab/studio.css" />
  <style>
    body.admin{background:var(--bg-gradient);background-attachment:fixed;min-height:100vh}
    .admin-wrap{max-width:1300px;margin:0 auto;padding:18px}
    .admin-tabs{display:flex;gap:6px;background:var(--breeze);border:1px solid var(--border-soft);border-radius:10px;padding:4px;margin-bottom:14px;flex-wrap:wrap}
    .admin-tabs button{background:transparent;border:none;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:1 1 auto;justify-content:center}
    .admin-tabs button .msi{font-size:18px}
    .admin-tabs button:hover{color:var(--primary)}
    .admin-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(31,28,61,.08)}

    table.adm{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden}
    table.adm th,table.adm td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border-soft);vertical-align:middle}
    table.adm th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#FAFBFD;font-weight:700;letter-spacing:.04em}
    table.adm tr:last-child td{border-bottom:none}
    .role-pill{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;text-transform:uppercase}
    .role-pill.admin{background:#FCE3E9;color:#991b1b}
    .role-pill.tester{background:var(--breeze);color:var(--ink2)}
    .status-pill{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;text-transform:uppercase}
    .status-pill.on{background:#DCFCE7;color:#166534}
    .status-pill.off{background:#FEE2E2;color:#991b1b}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:10px;margin-bottom:14px}

    .modal-bg{position:fixed;inset:0;background:rgba(15,17,32,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
    .modal-bg.open{display:flex}
    .modal{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
    .modal h3{margin:0;font-size:15px;color:var(--ink)}
    .modal label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .modal input, .modal select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;color:var(--ink)}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  </style>
</head>
<body class="admin studio">
  <header class="studio">
    <div class="brand">
      <img class="logo-vittoria" src="/lab/assets/vittoria.svg" alt="Vittoria Assicurazioni" />
      <div class="brand-text">
        <h1>NBA Studio — Dati <span class="brand-ver" id="brand-ver"></span></h1>
        <div class="sub">Pannello di gestione</div>
      </div>
    </div>
    <div class="actions">
      <a class="home-link" href="/lab/" title="Torna a NBA Studio"><span class="msi">arrow_back</span><span class="home-link-lbl">NBA Studio</span></a>
      <a class="home-link" href="/lab/checkup.html" title="Check-up Vittoria — simulatore bisogni"><span class="msi">health_and_safety</span><span class="home-link-lbl">Check-up</span></a>
      <a class="home-link" href="/lab/guida.html" title="Guida — come funziona l'algoritmo NBA"><span class="msi">menu_book</span><span class="home-link-lbl">Guida</span></a>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="admin-tabs" id="admin-tabs">
      <button class="active" data-tab="export"><span class="msi">build</span> Strumenti</button>
    </div>

    <section id="tab-export" class="hide"></section>
  </div>

  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script src="/lab/admin.js"></script>
</body>
</html>
