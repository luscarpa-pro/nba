name: Build NBA Studio (Windows .exe)

# Compila l'eseguibile standalone per Windows su un runner Windows.
# - Avvio manuale: tab "Actions" -> "Build NBA Studio (Windows .exe)" -> "Run workflow"
# - Automatico: a ogni tag v* (es. v2.0.0) compila e allega l'exe a una Release.

on:
  workflow_dispatch:        # avvio manuale dalla UI di GitHub
  push:
    tags:
      - "v*"                # es. v2.0.0 -> crea anche la Release

permissions:
  contents: write           # serve per creare la Release sui tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compila l'eseguibile
        run: python -m PyInstaller --noconfirm --clean tangible_lab\nba_studio.spec

      - name: Pubblica l'exe come artifact
        uses: actions/upload-artifact@v4
        with:
          name: NBAStudio-windows
          path: dist/NBAStudio.exe
          if-no-files-found: error
          retention-days: 30

      - name: Allega l'exe alla Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" "dist/NBAStudio.exe" --title "${{ github.ref_name }}" --generate-notes
        shell: bash
